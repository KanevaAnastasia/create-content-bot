services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: content_fabric_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: 5678
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL:-http://localhost:5678}"
      WEBHOOK_URL: "${WEBHOOK_URL:-http://localhost:5678}"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE:-Europe/Moscow}"
      TZ: "${TZ:-Europe/Moscow}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_BASIC_AUTH_ACTIVE: "${N8N_BASIC_AUTH_ACTIVE:-true}"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD}"
    volumes:
      - n8n_data:/home/node/.n8n
      - "${CONTENT_FABRIC_PUBLICATION_DIR:-/private/tmp/content_fabric_publications}:${CONTENT_FABRIC_PUBLICATION_DIR:-/private/tmp/content_fabric_publications}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_data:
