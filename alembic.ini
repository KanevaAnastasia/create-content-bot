[alembic]
script_location = migrations
prepend_sys_path = .

# The application reads DATABASE_URL from the environment. This placeholder keeps
# Alembic happy when tooling inspects the config before env.py overrides it.
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/content_fabric

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
